name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust checks
        shell: pwsh
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path rust/Cargo.toml

      - name: Build release binaries
        run: cargo build --release --manifest-path rust/Cargo.toml --bins

      - name: Portable smoke and commit check
        shell: pwsh
        run: |
          .\scripts\portable_smoke.ps1 -ExePath "$pwd\rust\target\release\zhfd-checkin.exe" -FixturePath "$pwd\autojs6\fixtures\ready.png"
          $expected = (git rev-parse --short=12 HEAD).Trim()
          $about = (& .\rust\target\release\zhfd-checkin.exe about | Out-String)
          if ($about -notmatch [regex]::Escape($expected)) { throw "Release EXE commit mismatch: expected=$expected`n$about" }

      - name: Package
        shell: pwsh
        run: .\scripts\package_release.ps1 -ReleaseDirectory "$pwd\dist"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip