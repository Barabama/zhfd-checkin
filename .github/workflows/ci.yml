name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust with quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Rust release build
        run: cargo build --release --manifest-path rust/Cargo.toml --bins

      - name: Portable EXE smoke test
        shell: pwsh
        run: .\scripts\portable_smoke.ps1 -ExePath "$pwd\rust\target\release\zhfd-checkin.exe" -FixturePath "$pwd\autojs6\fixtures\ready.png"

      - name: Verify release embeds current commit
        shell: pwsh
        run: |
          $expected = (git rev-parse --short=12 HEAD).Trim()
          $version = (cargo metadata --manifest-path rust/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $cliAbout = (& .\rust\target\release\zhfd-checkin.exe about | Out-String)
          $guiAbout = (& .\rust\target\release\zhfd-checkin-gui.exe about | Out-String)
          foreach ($binary in @(@{Name='CLI'; About=$cliAbout}, @{Name='GUI'; About=$guiAbout})) {
            if ($binary.About -notmatch "(?m)^Git commit:\s*$([regex]::Escape($expected))\s*$") {
              throw "$($binary.Name) commit mismatch. expected=$expected`n$($binary.About)"
            }
            # FR-014 provenance honesty: a checkout in CI is clean, so a `+dirty`
            # or `+unknown` build id means the stamping is broken (or git failed).
            if ($binary.About -notmatch "(?m)^Build id:\s*(\S+)") {
              throw "$($binary.Name) did not report a build id.`n$($binary.About)"
            }
            if ($Matches[1] -ne "$version-$expected") {
              throw "$($binary.Name) build id is not pinned to the clean checked-out commit. build_id=$($Matches[1]) expected=$version-$expected`n$($binary.About)"
            }
          }
      - name: Package Windows release artifact
        shell: pwsh
        run: .\scripts\package_release.ps1 -ReleaseDirectory "$pwd\dist"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhfd-checkin-windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python regression
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q scripts
          python scripts/test_image_states.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: AutoJs6 structural smoke test
        run: node autojs6/validate_node.js
