[package]
name = "zhfd-checkin"
version = "0.1.0"
edition = "2024"
description = "智汇福大 LDPlayer 自动签到控制器"
license = "MIT"
default-run = "zhfd-checkin"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = true, features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
eframe = { version = "0.33", default-features = true }
rfd = "0.15"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

